kind = "web"
previewPath = "/"
title = "Second Thought"
version = "1.0.0"
id = "artifacts/second-thought"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24383

[services.development]
run = "pnpm --filter @workspace/second-thought run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/second-thought", "run", "build" ]
publicDir = "artifacts/second-thought/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24383"
BASE_PATH = "/"
